name: Sync data subsets

on:
  workflow_dispatch:


jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one failing target doesn't stop the others
      matrix:
        include:
          - target_repo: kilianvolmer/Flu-Forecast-Claude-Full
          - target_repo: kilianvolmer/Flu-Forecast-Claude-Numbers
    steps:
      - uses: actions/checkout@v4

      - name: Push subset to target repo
        env:
          TOKEN: ${{ secrets.SHARE_DATA }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${{ matrix.target_repo }}.git" target

          # clear target (keep .git), then copy each requested folder
          mkdir -p target/target-data
          cp -r target-data/*.csv target/target-data
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sync target data from ${GITHUB_REPOSITORY} @ ${GITHUB_SHA::7}"
          git push